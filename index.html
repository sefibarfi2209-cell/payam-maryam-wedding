<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>دعوتنامه عروسی</title>

    <!-- فونت وزیرمتن (شبیه ایران سنس) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
          rel="stylesheet" type="text/css">

    <link rel="stylesheet" href="style.css">
</head>


<body>


<!-- صحنه‌ی افتتاحیه: پاکت‌نامه -->
<div id="introScreen">

    <div class="envelope-scene" id="envelopeScene">

        <div class="envelope-flip-wrap">

            <div class="envelope-flip-inner" id="envelopeFlipInner">

                <!-- روی پشت پاکت: تمبر + مهر پستی + متن دعوت -->
                <div class="envelope-face envelope-face-back kraft">

                    <!-- مهر پستی -->
                    <svg class="postmark" viewBox="0 0 130 74" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g stroke="#4d5c6b" stroke-width="2" stroke-linecap="round">
                            <path d="M4 12 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0"/>
                            <path d="M4 25 q5 -4 10 0 t10 0 t10 0 t10 0"/>
                            <path d="M4 38 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0"/>
                            <path d="M4 51 q5 -4 10 0 t10 0 t10 0 t10 0"/>
                            <path d="M4 64 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0"/>
                        </g>
                        <circle cx="95" cy="37" r="31" stroke="#4d5c6b" stroke-width="2"/>
                        <circle cx="95" cy="37" r="22" stroke="#4d5c6b" stroke-width="1.2"/>
                        <defs>
                            <path id="pm-arc" d="M95 15 a22 22 0 1 1 -0.05 0"/>
                        </defs>
                        <text font-size="6.5" fill="#4d5c6b" letter-spacing="2" font-family="Arial">
                            <textPath href="#pm-arc">I.R.I ★ POSTAL ★ SERVICE ★</textPath>
                        </text>
                        <g stroke="#4d5c6b" stroke-width="1.4" fill="none">
                            <rect x="86" y="34" width="18" height="7" rx="1.5"/>
                            <circle cx="90" cy="43.5" r="1.6"/>
                            <circle cx="100" cy="43.5" r="1.6"/>
                            <path d="M86 34 l3 -4 h10 l3 4"/>
                        </g>
                    </svg>

                    <!-- تمبر -->
                    <div class="postage-stamp">

                        <!-- نقاشی خطی عروس و داماد -->
                        <svg class="stamp-art" viewBox="0 0 100 74" xmlns="http://www.w3.org/2000/svg">
                            <g fill="none" stroke="#3f3f3f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="38" cy="16" r="7"/>
                                <circle cx="45" cy="9" r="3"/>
                                <path d="M31 13 Q26 20 29 29"/>
                                <path d="M38 23 C33 32 30 42 27 50 Q38 56 49 50 C46 42 43 32 38 23 Z"/>
                                <path d="M43 32 Q47 38 49 44"/>
                                <circle cx="66" cy="15" r="7"/>
                                <path d="M59 12 Q66 6 73 12"/>
                                <path d="M66 22 L58 50 L74 50 Z"/>
                                <path d="M63 24 L66 30 L69 24"/>
                                <path d="M60 34 Q54 38 49 44"/>
                            </g>
                            <path d="M53 10 c-1-1.8 -3.6-1.1 -3.6 .7 0 1.4 1.8 2.5 3.6 4 1.8-1.5 3.6-2.6 3.6-4 0-1.8 -2.6-2.5 -3.6-.7z" fill="#3f3f3f"/>
                            <path d="M85 24 c-.8-1.4 -2.9-.9 -2.9 .6 0 1.1 1.4 2 2.9 3.2 1.5-1.2 2.9-2.1 2.9-3.2 0-1.5 -2.1-2 -2.9-.6z" fill="#3f3f3f"/>
                        </svg>

                        <div class="stamp-label">
                            <span class="stamp-logo">✉</span>
                            <span class="stamp-names">
                                <b>تمبر طلایی</b>
                                <i>Golden Stamp</i>
                            </span>
                        </div>

                    </div>

                    <!-- متن دعوت -->
                    <div class="env-invite-text">
                        با تشریف فرمایی خود سرافرازمان نمایید
                    </div>

                </div>

                <!-- روی جلوی پاکت: لایه‌ها + مهر موم -->
                <div class="envelope-face envelope-face-front">

                    <div class="envelope" id="envelope" onclick="openEnvelope()">

                        <!-- ۱) داخل تیره‌ی پاکت (دهانه V) -->
                        <div class="env-interior"></div>

                        <!-- ۲) فلپ باز‌شده: نوک رو به بالا -->
                        <div class="flap-opened"></div>

                        <!-- ۳) کارت چرخیده داخل پاکت -->
                        <div class="pull-card" id="pullCard">
                            <img src="cover.png" alt="" decoding="async">
                        </div>

                        <!-- ۴) بدنه‌ی پاکت با بریدگی V -->
                        <div class="env-pocket kraft">
                            <svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                                <g fill="none" stroke="#6d4f2f" stroke-width="1" opacity="0.4">
                                    <path d="M0 100 L50 78 L100 100" vector-effect="non-scaling-stroke"/>
                                </g>
                            </svg>
                        </div>

                        <!-- ۵) فلپ بسته -->
                        <div class="flap-closed">
                            <div class="flap-note">بر روی مهر بزنید</div>
                        </div>

                        <!-- ۶) مهر موم -->
                        <div class="env-seal">
                            <div class="wax"></div>
                            <svg class="wax-rings" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                                <g fill="none" stroke="#7c5510" stroke-width="3" stroke-linecap="round">
                                    <circle cx="23" cy="35" r="10"/>
                                    <circle cx="37" cy="35" r="10"/>
                                </g>
                                <path d="M30 15.5c-1.9-3.1-6.3-1.9-6.3 1.3 0 2.5 3.1 4.4 6.3 6.9 3.2-2.5 6.3-4.4 6.3-6.9 0-3.2-4.4-4.4-6.3-1.3z" fill="#7c5510"/>
                            </svg>
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <p class="envelope-hint" id="envelopeHint">برای باز کردن دعوتنامه لمس کنید</p>

    </div>

</div>


<!-- کارت نهایی: فقط با transform حرکت می‌کند (GPU) -->
<div class="reveal-card" id="revealCard">
    <img src="cover.png" alt="" decoding="async">
</div>


<div class="page" id="mainContent">


    <!-- ویدیو -->
    <div class="video-container" id="videoContainer">

        <video
           id="mainVideo"
           muted
           loop
           playsinline
           controls
           preload="auto"
           poster="cover.png">

            <source src="wedding.mp4" type="video/mp4">

            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.

        </video>

        <!-- دکمه فعال‌سازی صدا -->
        <button
            class="sound-toggle"
            id="soundToggle"
            onclick="toggleSound()"
            aria-label="فعال‌سازی صدا">

            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>

        </button>

    </div>

    <!-- دکمه‌ی بستن حالت تمام‌صفحه -->
    <button
        class="expand-close-btn"
        id="expandCloseBtn"
        onclick="toggleExpand()"
        aria-label="بستن حالت تمام‌صفحه">

        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    </button>

</div>
<!-- پایان mainContent -->


<!-- نوار کنترل پایین -->
<div class="control-bar" id="controlBar">

    <button class="control-btn text-btn" onclick="openInfo()" aria-label="اطلاعات مراسم">
        اطلاعات مراسم
    </button>

    <button class="control-btn" id="playPauseBtn" onclick="togglePlayPause()" aria-label="پخش/توقف">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
    </button>

    <button class="control-btn" onclick="toggleExpand()" aria-label="بزرگ‌نمایی">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>

</div>



<!-- پنجره اطلاعات -->

<div
    class="overlay"
    id="infoOverlay"
    onclick="closeOutside(event)">


    <div class="info-card">


        <button
            class="close-button"
            onclick="closeInfo()">

            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        </button>


        <div class="card-title">

            اطلاعات مراسم

        </div>


        <div class="info-item">

            <span class="info-label">
                تاریخ
            </span>

            <span class="info-value gold">
                پنجشنبه ۹ مهر ۱۴۰۵
            </span>

        </div>


        <div class="info-item">

            <span class="info-label">
                ساعت
            </span>

            <span class="info-value">
                ۱۹ تا پاسی از شب
            </span>

        </div>


        <div class="info-item">

            <span class="info-label">
                مکان مراسم
            </span>

            <span class="info-value">

                شهریار، باغستان، وحید ۳

                <br>

                باغ عمارت ارغوان

            </span>

        </div>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>
